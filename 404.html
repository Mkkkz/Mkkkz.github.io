<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>404 — Página não encontrada | Miguel Inácio</title>
    <meta name="description" content="Página não encontrada no portfólio de Miguel Inácio.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://mkkkz.github.io/404.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Miguel Inácio">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary">

    <!-- Favicon -->

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.webmanifest">

    <!-- Styles -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

    <main class="notfound">
        <div class="container notfound__inner">

            <!-- Ilustração: janela de editor (CSS puro) -->
            <div class="notfound__art" aria-hidden="true">
                <div class="terminal">
                    <div class="terminal__bar">
                        <span class="terminal__dot"></span>
                        <span class="terminal__dot"></span>
                        <span class="terminal__dot"></span>
                        <span class="terminal__title">erro.js</span>
                    </div>
                    <div class="terminal__body">
                        <p class="terminal__line"><span class="terminal__prompt">$</span> procurar página</p>
                        <p class="terminal__line terminal__line--error">erro: 404 · página não encontrada</p>
                        <p class="terminal__line terminal__line--cursor">$ <span class="terminal__cursor">▌</span></p>
                    </div>
                </div>
            </div>

            <div class="notfound__content">
                <h1 class="notfound__code">404</h1>
                <p class="notfound__message">A página que você tentou acessar não existe ou foi movida.</p>
                <a href="./index.html" class="btn btn--primary">Voltar para o início</a>
            </div>

        </div>
    </main>

</body>
</html>
